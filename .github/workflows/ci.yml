name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  PLAYWRIGHT_VERSION: 1.63.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: Install pinned browser test runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/holi-playwright"
          mkdir -p "$runtime"
          npm install --prefix "$runtime" --package-lock=false --no-save "@playwright/test@$PLAYWRIGHT_VERSION"
          echo "NODE_PATH=$runtime/node_modules" >> "$GITHUB_ENV"
          echo "$runtime/node_modules/.bin" >> "$GITHUB_PATH"
          "$runtime/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run production browser regression
        run: playwright test --config=playwright.config.cjs
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
