name: CI

on:
  pull_request:
  push:
    branches: [main]


jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checked-out revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: Install Chromium for locked Playwright runtime
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Run production browser regression
        run: ./node_modules/.bin/playwright test --config=playwright.config.cjs
      - name: Build Cloudflare Pages static artifact
        env:
          CF_PAGES: "1"
        run: npm run build
      - name: Upload Cloudflare Pages static artifact
        uses: actions/upload-artifact@v4
        with:
          name: holi-cloudflare-pages
          path: out/
          if-no-files-found: error
          retention-days: 7
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
